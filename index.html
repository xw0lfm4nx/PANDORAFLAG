<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PANDORAFLAG</title>
  <meta name="description" content="PANDORA WEB FOR WORLDWIDE FLAGS">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #f8fafc;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 3rem 1rem 2rem;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
      letter-spacing: 0.1em;
    }

    header p {
      margin: 0.5rem 0 0;
      color: #94a3b8;
    }

    .search-bar {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
      padding: 0 1rem;
    }

    #search {
      width: 100%;
      max-width: 400px;
      padding: 0.75rem 1rem;
      border-radius: 999px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 1rem;
    }

    #search:focus {
      outline: 2px solid #38bdf8;
    }

    .flags-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1rem;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
    }

    .flag-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .flag-card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
    }

    .flag-card .flag {
      font-size: 3rem;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .flag-card .name {
      font-size: 0.95rem;
      color: #e2e8f0;
    }

    footer {
      text-align: center;
      color: #64748b;
      padding: 1.5rem;
      font-size: 0.85rem;
    }

    #empty-message {
      display: none;
      text-align: center;
      color: #94a3b8;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🏳️ PANDORAFLAG</h1>
    <p>PANDORA WEB FOR WORLDWIDE FLAGS</p>
  </header>

  <div class="search-bar">
    <input type="search" id="search" placeholder="Buscar país..." aria-label="Buscar país">
  </div>

  <p id="empty-message">No se encontraron banderas para tu búsqueda.</p>
  <main class="flags-grid" id="flags-grid"></main>

  <footer>
    &copy; <span id="year"></span> PANDORAFLAG
  </footer>

  <script>
    const countries = [
      { name: "Argentina", flag: "🇦🇷" },
      { name: "Brasil", flag: "🇧🇷" },
      { name: "Chile", flag: "🇨🇱" },
      { name: "Colombia", flag: "🇨🇴" },
      { name: "México", flag: "🇲🇽" },
      { name: "España", flag: "🇪🇸" },
      { name: "Estados Unidos", flag: "🇺🇸" },
      { name: "Canadá", flag: "🇨🇦" },
      { name: "Francia", flag: "🇫🇷" },
      { name: "Alemania", flag: "🇩🇪" },
      { name: "Italia", flag: "🇮🇹" },
      { name: "Reino Unido", flag: "🇬🇧" },
      { name: "Portugal", flag: "🇵🇹" },
      { name: "Países Bajos", flag: "🇳🇱" },
      { name: "Rusia", flag: "🇷🇺" },
      { name: "China", flag: "🇨🇳" },
      { name: "Japón", flag: "🇯🇵" },
      { name: "Corea del Sur", flag: "🇰🇷" },
      { name: "India", flag: "🇮🇳" },
      { name: "Australia", flag: "🇦🇺" },
      { name: "Nueva Zelanda", flag: "🇳🇿" },
      { name: "Sudáfrica", flag: "🇿🇦" },
      { name: "Egipto", flag: "🇪🇬" },
      { name: "Nigeria", flag: "🇳🇬" },
      { name: "Kenia", flag: "🇰🇪" },
      { name: "Marruecos", flag: "🇲🇦" },
      { name: "Turquía", flag: "🇹🇷" },
      { name: "Arabia Saudita", flag: "🇸🇦" },
      { name: "Emiratos Árabes Unidos", flag: "🇦🇪" },
      { name: "Suecia", flag: "🇸🇪" },
      { name: "Noruega", flag: "🇳🇴" },
      { name: "Finlandia", flag: "🇫🇮" },
      { name: "Dinamarca", flag: "🇩🇰" },
      { name: "Grecia", flag: "🇬🇷" },
      { name: "Polonia", flag: "🇵🇱" },
      { name: "Ucrania", flag: "🇺🇦" },
      { name: "Suiza", flag: "🇨🇭" },
      { name: "Irlanda", flag: "🇮🇪" },
      { name: "Bélgica", flag: "🇧🇪" },
      { name: "Austria", flag: "🇦🇹" }
    ];

    const grid = document.getElementById("flags-grid");
    const emptyMessage = document.getElementById("empty-message");
    const searchInput = document.getElementById("search");

    function renderFlags(list) {
      grid.innerHTML = "";
      emptyMessage.style.display = list.length === 0 ? "block" : "none";
      list.forEach(({ name, flag }) => {
        const card = document.createElement("div");
        card.className = "flag-card";

        const flagEl = document.createElement("div");
        flagEl.className = "flag";
        flagEl.textContent = flag;

        const nameEl = document.createElement("div");
        nameEl.className = "name";
        nameEl.textContent = name;

        card.appendChild(flagEl);
        card.appendChild(nameEl);
        grid.appendChild(card);
      });
    }

    searchInput.addEventListener("input", (event) => {
      const query = event.target.value.trim().toLowerCase();
      const filtered = countries.filter((country) =>
        country.name.toLowerCase().includes(query)
      );
      renderFlags(filtered);
    });

    document.getElementById("year").textContent = new Date().getFullYear();
    renderFlags(countries);
  </script>
</body>
</html>
