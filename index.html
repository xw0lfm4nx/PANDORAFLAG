<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P∆NDOR∆ - Explorador Global</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Leaflet CSS for the Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --bg-main: #0b111e;
            --bg-panel: #15202e;
            --bg-card: #1c2a38;
            --accent: #40c4ff;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Barra de Navegación */
        .navbar {
            background-color: var(--bg-panel);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.75rem 2rem;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: 1px;
            color: white !important;
        }

        .navbar-brand span {
            color: var(--accent);
        }

        .search-container {
            position: relative;
            margin-left: 2rem;
            width: 300px;
        }

        .search-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-input {
            background-color: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            color: white;
            padding: 0.4rem 1rem 0.4rem 2.5rem;
            width: 100%;
        }
        
        .search-input:focus {
            background-color: var(--bg-card);
            color: white;
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 0.2rem rgba(64, 196, 255, 0.25);
        }

        .nav-link {
            color: var(--text-muted) !important;
            font-weight: 500;
            padding: 0.5rem 1rem !important;
            transition: color 0.2s;
        }
        
        .nav-link:hover { color: white !important; }
        
        .nav-link.active {
            color: var(--accent) !important;
            border-bottom: 2px solid var(--accent);
        }

        /* Contenedor Principal */
        .main-container {
            flex: 1;
            padding: 1.5rem;
            overflow: hidden;
        }

        /* Mapa */
        .map-container {
            height: 100%;
            background-color: var(--bg-panel);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        #map {
            width: 100%;
            height: 100%;
            background: #0f1722;
        }

        /* Panel Lateral */
        .sidebar {
            height: 100%;
            background-color: var(--bg-panel);
            border-radius: 16px;
            padding: 1.5rem;
            overflow-y: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .country-header {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .country-flag {
            font-size: 2rem;
            margin-right: 1rem;
            border-radius: 4px;
        }
        .country-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            text-transform: uppercase;
        }

        /* Tarjetas (Cards) de información */
        .info-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            transition: transform 0.2s, background-color 0.2s;
            border: 1px solid rgba(255,255,255,0.02);
            height: 100%;
        }
        
        .info-card:hover { background-color: #233547; }

        .card-label {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            margin: 0;
        }

        .icon-accent { color: var(--accent); font-size: 1.1rem; }

        .chart-placeholder {
            height: 40px;
            width: 100%;
            margin-top: 10px;
            background: linear-gradient(180deg, rgba(64,196,255,0.1) 0%, rgba(64,196,255,0) 100%);
            border-bottom: 2px solid var(--accent);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <!-- Logo estilizado -->
            <a class="navbar-brand" href="#">P<span>∆</span>NDOR<span>∆</span></a>
            
            <form class="d-flex me-auto search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input class="form-control search-input" type="search" placeholder="Buscar país..." aria-label="Search">
            </form>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                <li class="nav-item">
                    <a class="nav-link active" href="#">Mapa Mundial</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Datos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Explorar</a>
                </li>
                <li class="nav-item ms-3">
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-white text-decoration-none" id="dropdownUser1" aria-expanded="false">
                            <i class="fa-solid fa-circle-user fs-4 text-muted"></i>
                        </a>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <div class="row h-100 g-4">
            
            <!-- Columna del Mapa -->
            <div class="col-lg-8 h-100">
                <div class="map-container">
                    <div id="map"></div>
                </div>
            </div>

            <!-- Columna del Panel de Datos -->
            <div class="col-lg-4 h-100">
                <div class="sidebar">
                    
                    <div class="country-header">
                        <span class="country-flag">🇵🇪</span>
                        <h2 class="country-title">Perú</h2>
                        <i class="fa-solid fa-ellipsis-vertical ms-auto text-muted" style="cursor: pointer;"></i>
                    </div>

                    <div class="row g-3">
                        
                        <!-- Población -->
                        <div class="col-12">
                            <div class="info-card">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <div class="card-label">
                                            <i class="fa-solid fa-users icon-accent"></i> Población
                                        </div>
                                        <p class="card-value">34.3 millones</p>
                                    </div>
                                    <div style="width: 100px;">
                                        <div class="chart-placeholder"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Año Independencia -->
                        <div class="col-12">
                            <div class="info-card">
                                <div class="card-label">
                                    <i class="fa-regular fa-flag icon-accent"></i> Año de Independencia
                                </div>
                                <div class="d-flex justify-content-between align-items-center">
                                    <p class="card-value fs-4">1821</p>
                                    <span class="badge" style="background-color: rgba(255,255,255,0.1); color: #cbd5e1;">Hace 205 años</span>
                                </div>
                            </div>
                        </div>

                        <!-- Clima -->
                        <div class="col-12">
                            <div class="info-card">
                                <div class="card-label">
                                    <i class="fa-solid fa-cloud-sun-rain icon-accent"></i> Clima
                                </div>
                                <p class="card-value">Variado (Costa, Sierra, Selva)</p>
                            </div>
                        </div>

                        <!-- Capital -->
                        <div class="col-6">
                            <div class="info-card">
                                <div class="card-label">
                                    <i class="fa-solid fa-location-dot icon-accent"></i> Capital
                                </div>
                                <p class="card-value">LIMA</p>
                            </div>
                        </div>

                        <!-- Idioma -->
                        <div class="col-6">
                            <div class="info-card">
                                <div class="card-label">
                                    <i class="fa-solid fa-comments icon-accent"></i> Idioma Principal
                                </div>
                                <p class="card-value">Español</p>
                            </div>
                        </div>

                        <!-- Moneda -->
                        <div class="col-6">
                            <div class="info-card">
                                <div class="card-label">
                                    <i class="fa-solid fa-coins icon-accent"></i> Moneda
                                </div>
                                <p class="card-value">Sol (PEN)</p>
                            </div>
                        </div>
                        
                        <!-- Cooficiales -->
                        <div class="col-6">
                            <div class="info-card">
                                <div class="card-label">
                                    <i class="fa-solid fa-language icon-accent"></i> Cooficiales
                                </div>
                                <p class="card-value fs-6">Quechua, Aimara</p>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Leaflet JS para el Mapa Interactivo -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Inicializar el Mapa
        const map = L.map('map', {
            zoomControl: false // Movemos el control para que no estorbe
        }).setView([-9.19, -75.0152], 5); // Coordenadas centradas en Perú

        // Agregar las capas del mapa con tema oscuro (CartoDB Dark Matter)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> contributors',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Control de zoom arriba a la izquierda
        L.control.zoom({ position: 'topleft' }).addTo(map);

        // Pin personalizado para Lima
        const customIcon = L.divIcon({
            className: 'custom-div-icon',
            html: "<i class='fa-solid fa-location-dot fa-2x' style='color: #40c4ff; filter: drop-shadow(0px 0px 5px rgba(64,196,255,0.5));'></i>",
            iconSize: [30, 42],
            iconAnchor: [15, 42]
        });

        L.marker([-12.0464, -77.0428], {icon: customIcon}).addTo(map)
            .bindPopup('<b style="color:black; font-family:sans-serif;">Lima, Perú</b>')
            .openPopup();
    </script>
</body>
</html>
